# The bar answers the question a remote desktop always raises: which machine
# am I actually looking at, and is it healthy?

general {
        colors = true
        color_good = "#e8e0d4"
        color_degraded = "#d78a3c"
        color_bad = "#c25a4a"
        interval = 5
        separator = " · "
}

order += "read_file machine"
order += "load"
order += "memory"
order += "disk /home/dev"
order += "tztime local"

read_file machine {
        path = "/etc/mola/machine-label"
        format = "%content"
        max_characters = 48
}

load {
        format = "load %1min"
}

memory {
        format = "mem %used/%total"
        threshold_degraded = "10%"
}

disk "/home/dev" {
        format = "disk %avail free"
        prefix_type = custom
}

tztime local {
        format = "%Y-%m-%d %H:%M UTC"
        timezone = "UTC"
}
